services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gcg
      POSTGRES_PASSWORD: gcg
      POSTGRES_DB: gcg_prices
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gcg -d gcg_prices"]
      interval: 3s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://gcg:gcg@db:5432/gcg_prices
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      FETCH_DELAY_SECONDS: "2"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/data:ro

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  pgdata:
